# Synork Home — Home Assistant Add-on Manifest
name: "Synork Home"
version: "0.2.14"
slug: synork_home
description: >-
  Synork Home — smart home hub add-on for Home Assistant.
  Connects to the Synork relay for cloud intelligence, persona management,
  and voice assistant capabilities.
url: "https://github.com/synork/synork-home"
arch:
  - aarch64
  - amd64

# --------------------------------------------------------------------------- #
# Add-on options (user-configurable via the HA add-on config UI)
# --------------------------------------------------------------------------- #
options:
  mode: "hub"
  relay_url: "wss://api.synork.dev/api/home/ws"
  relay_api_url: "https://api.synork.dev"
  device_id: ""
  device_secret: ""
  language: "hu"
  log_level: "info"
  mock_hardware: false
  local_stt: true
  cloud_stt: false
  wake_word: "hey_synork"
  tts_provider: "auto"
  cartesia_voice_id: ""
  arlo_enabled: true
  arlo_language: ""
  wake_word_threshold: 0.55
  whisper_model: "large-v3-turbo"
  assistant_pipeline: true
  frontend_patcher: true
  satellite_port: 8765
  audio_device: "auto"
  update_channel: "stable"
  update_repo_url: "https://github.com/synork/synork-home-addon.git"
  disable_autoupdate: false

schema:
  mode: list(hub|assistant)
  relay_url: url
  relay_api_url: url
  device_id: str
  device_secret: password
  language: str
  log_level: list(debug|info|warning|error)
  mock_hardware: bool
  local_stt: bool
  cloud_stt: bool
  wake_word: str
  tts_provider: list(auto|cartesia|piper|elevenlabs)
  cartesia_voice_id: str
  arlo_enabled: bool
  arlo_language: str
  wake_word_threshold: float(0.0,1.0)
  whisper_model: list(tiny|base|small|medium|large-v3|large-v3-turbo)
  assistant_pipeline: bool
  frontend_patcher: bool
  satellite_port: "int(1024,65535)?"
  audio_device: str
  update_channel: list(stable|beta|dev)
  update_repo_url: url
  disable_autoupdate: bool

# --------------------------------------------------------------------------- #
# Network
# --------------------------------------------------------------------------- #
ports:
  8099/tcp: null
  5353/udp: null
ports_description:
  8099/tcp: "Synork Home setup wizard (HA ingress) — also reserved for the local API"
  5353/udp: "mDNS advertisement"

# Host network for mDNS and WiFi AP (needed for network-level provisioning)
host_network: true

# --------------------------------------------------------------------------- #
# HA frontend integration
# --------------------------------------------------------------------------- #
ingress: true
panel_icon: "mdi:home-assistant"
panel_title: "Synork Home"

# --------------------------------------------------------------------------- #
# Filesystem mappings
# --------------------------------------------------------------------------- #
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw

# --------------------------------------------------------------------------- #
# Capabilities and access
# --------------------------------------------------------------------------- #
hassio_api: true
hassio_role: manager  # required to install/start core_zwave_js, core_matter_server, core_openthread_border_router
homeassistant_api: true
auth_api: true

# Audio support for voice pipeline
audio: true

# USB access for radio dongles (Zigbee/Z-Wave)
usb: true

# Required for s6-overlay v3 base images: disable Docker's default
# init wrapper so the image's `/init` (s6-overlay) becomes PID 1.
init: false

# Privileged for hostapd (WiFi AP) and network configuration
privileged:
  - NET_ADMIN
  - SYS_ADMIN

# --------------------------------------------------------------------------- #
# Environment
# --------------------------------------------------------------------------- #
environment:
  PYTHONUNBUFFERED: "1"

